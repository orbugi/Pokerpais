<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        #setup-screen { position: fixed; inset: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .input-group { margin-bottom: 15px; }
        input { padding: 12px; border-radius: 8px; border: none; width: 200px; }
        
        #table-container { position: relative; height: 60vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #1a5d1a 0%, #0a3d0a 100%); }
        .poker-table { width: 90%; height: 80%; border: 15px solid #3d2b1f; border-radius: 200px; position: relative; box-shadow: inset 0 0 50px #000; }
        
        .player-node { position: absolute; width: 80px; text-align: center; }
        .avatar { background: #222; border-radius: 50%; width: 60px; height: 60px; margin: 0 auto; border: 2px solid #444; display: flex; align-items: center; justify-content: center; position: relative; }
        .active-turn { border-color: #f1c40f; box-shadow: 0 0 15px #f1c40f; }
        .role-badge { position: absolute; bottom: -5px; right: -5px; background: #f1c40f; color: #000; font-weight: bold; padding: 2px 6px; border-radius: 50%; font-size: 12px; }
        .chip-on-table { position: absolute; color: #f1c40f; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px #000; }
    </style>
</head>
<body>
    <div id="setup-screen">
        <h2>כניסה לשולחן פוקר</h2>
        <div class="input-group"><input type="text" id="p-name" placeholder="שם שחקן"></div>
        <div class="input-group"><input type="number" id="p-buyin" placeholder="סכום כניסה (מינימום 100)" value="200"></div>
        <button onclick="enterGame()" style="padding:15px 40px; background:#f1c40f; border:none; border-radius:8px; font-weight:bold;">היכנס לשולחן</button>
    </div>

    <div id="game-ui" style="display:none;">
        <div id="table-container">
            <div class="poker-table">
                <div id="community" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:flex; gap:10px;"></div>
                <div id="players-ring"></div>
            </div>
        </div>
        <div style="text-align:center; font-size:24px; color:#f1c40f;">קופה: <span id="pot-total">0</span></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function enterGame() {
            const name = document.getElementById('p-name').value;
            const buyin = document.getElementById('p-buyin').value;
            if(name && buyin >= 100) {
                socket.emit('joinGame', {name, buyin});
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
            } else { alert("מינימום כניסה: 100"); }
        }

        socket.on('gameUpdate', (data) => {
            document.getElementById('pot-total').innerText = data.gameState.pot;
            const ring = document.getElementById('players-ring');
            ring.innerHTML = '';
            
            data.players.forEach((p, i) => {
                const angle = (i / data.players.length) * 2 * Math.PI;
                const x = Math.cos(angle) * 40 + 50; const y = Math.sin(angle) * 40 + 50;
                const cx = Math.cos(angle) * 25 + 50; const cy = Math.sin(angle) * 25 + 50;

                ring.innerHTML += `
                    <div class="player-node" style="left:${x}%; top:${y}%; transform:translate(-50%,-50%);">
                        <div class="avatar ${i === data.gameState.turnIndex ? 'active-turn' : ''}">
                            <span style="font-size:10px;">$${p.chips}</span>
                            ${p.role ? `<div class="role-badge">${p.role}</div>` : ''}
                        </div>
                        <div style="font-size:12px; margin-top:5px;">${p.username}</div>
                    </div>
                    <div class="chip-on-table" style="left:${cx}%; top:${cy}%; transform:translate(-50%,-50%);">
                        ${p.betThisRound > 0 ? '🪙 ' + p.betThisRound : ''}
                    </div>`;
            });
        });
    </script>
</body>
</html>
