<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #000; color: white; font-family: sans-serif; margin: 0; }
        #admin-panel { display: none; background: #222; padding: 10px; border-bottom: 2px solid #b8860b; justify-content: center; gap: 10px; }
        .table-area { height: 70vh; position: relative; display: flex; justify-content: center; align-items: center; }
        .felt { width: 90%; height: 70%; background: #1a5d1a; border: 10px solid #3d2b1f; border-radius: 500px; position: relative; box-shadow: inset 0 0 50px #000; }
        .player { position: absolute; text-align: center; width: 100px; }
        .head { background: #111; border: 2px solid #555; border-radius: 10px; padding: 5px; } /* כסף בראש */
        .chip { width: 30px; height: 30px; background: radial-gradient(circle, #f1c40f, #d4ac0d); border: 2px dashed #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; font-weight: bold; margin: 5px auto; } /* צ'יפ בשולחן */
        input { padding: 10px; border-radius: 5px; border: none; }
    </style>
</head>
<body>

<div id="admin-panel">
    <input type="number" id="m-val" placeholder="מקסימום">
    <input type="number" id="s-val" placeholder="SB">
    <button onclick="update()" style="background:#b8860b; color:black; font-weight:bold;">נעל חוקים</button>
</div>

<div id="login-view" style="text-align:center; padding-top:100px;">
    <h2 id="rules-msg">מחכה לחוקי שולחן...</h2>
    <input type="text" id="p-name" placeholder="שם שחקן"><br><br>
    <input type="number" id="p-buyin" placeholder="סכום כניסה"><br><br>
    <button onclick="join()" style="background:#8b6508; color:white; padding:15px 40px; border:none; border-radius:10px;">היכנס</button>
</div>

<div id="game-view" style="display:none;">
    <div class="table-area"><div class="felt" id="table-players"></div></div>
</div>

<script>
    const socket = io();
    const isAdmin = new URLSearchParams(window.location.search).get('admin') === 'true';
    if (isAdmin) document.getElementById('admin-panel').style.display = 'flex';

    function update() {
        socket.emit('set_rules', { max: document.getElementById('m-val').value, sb: document.getElementById('s-val').value });
    }

    socket.on('rules_updated', (data) => {
        document.getElementById('rules-msg').innerText = `חוקי שולחן: מקסימום ${data.max} | SB: ${data.sb}`;
        window.maxBuyin = data.max;
    });

    function join() {
        const buyin = document.getElementById('p-buyin').value;
        if (buyin > window.maxBuyin) return alert("חורג מהמקסימום!");
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'block';
        // כאן המערכת תציג את השחקן עם הכסף בראש והצ'יפ בשולחן
    }
</script>
</body>
</html>
