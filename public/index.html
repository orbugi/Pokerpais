<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #0a0a0a; color: white; margin: 0; font-family: system-ui; }
        #admin-panel { display: none; background: #222; padding: 15px; border-bottom: 3px solid #ffd700; text-align: center; gap: 10px; }
        .table-area { height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(#1e5d1e, #000); }
        .poker-table { width: 90%; max-width: 800px; height: 400px; border: 15px solid #4a3728; border-radius: 200px; position: relative; box-shadow: inset 0 0 100px #000; }
        .pot { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); background: #ffd700; color: black; padding: 5px 20px; border-radius: 20px; font-weight: bold; }
        .cards { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 10px; }
        .card { width: 60px; height: 90px; background: white; color: black; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; animation: slideIn 0.4s ease; }
        @keyframes slideIn { from { transform: translateY(-500px); opacity: 0; } }
        .player { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; }
        .chip { width: 40px; height: 40px; background: red; border: 3px dashed white; border-radius: 50%; margin: 0 auto 5px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="admin-panel">
    <input type="number" id="m_val" placeholder="מקסימום כניסה">
    <input type="number" id="s_val" placeholder="Small Blind">
    <button onclick="saveRules()">קבע חוקים</button>
    <button onclick="deal('flop')" style="background:green;color:white;">חלק פלופ</button>
</div>

<div id="overlay">
    <div style="background:#333; padding:40px; border-radius:20px; text-align:center;">
        <h2 id="status">מחכה לאדמין...</h2>
        <input type="text" id="p_name" placeholder="שם שחקן"><br><br>
        <input type="number" id="p_buyin" placeholder="סכום כניסה"><br><br>
        <button onclick="join()">היכנס לשולחן</button>
    </div>
</div>

<div class="table-area">
    <div class="poker-table">
        <div class="pot">POT: <span id="pot_val">0</span></div>
        <div class="cards" id="community"></div>
        <div id="players"></div>
    </div>
</div>

<script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    if (params.get('admin') === 'true') document.getElementById('admin-panel').style.display = 'block';

    function saveRules() {
        socket.emit('admin_config', { max: document.getElementById('m_val').value, sb: document.getElementById('s_val').value });
    }

    function join() {
        socket.emit('player_join', { name: document.getElementById('p_name').value, buyin: document.getElementById('p_buyin').value });
        document.getElementById('overlay').style.display = 'none';
    }

    function deal(type) { socket.emit('deal_cards', type); }

    socket.on('update_table', (data) => {
        document.getElementById('status').innerText = `חוקים: מקסימום ${data.maxBuyin}, SB: ${data.sb}`;
        document.getElementById('pot_val').innerText = data.pot;
        document.getElementById('community').innerHTML = data.communityCards.map(c => `<div class="card">${c}</div>`).join('');
        
        document.getElementById('players').innerHTML = data.players.map(p => `
            <div class="player">
                <div class="chip">${p.bet}</div>
                <div style="background:#000; padding:10px; border:1px solid gold; border-radius:10px;">
                    <b>${p.name}</b><br><span style="color:green">$${p.stack}</span>
                </div>
            </div>
        `).join('');
    });
</script>
</body>
</html>
