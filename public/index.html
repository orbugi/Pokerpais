<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { background: #000; color: #fff; font-family: system-ui; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #admin { background: #222; padding: 10px; display: none; justify-content: center; gap: 10px; border-bottom: 2px solid #f1c40f; }
        #table { flex-grow: 1; position: relative; background: radial-gradient(circle, #222 0%, #000 100%); display: flex; align-items: center; justify-content: center; }
        .green-felt { width: 85vw; height: 50vw; background: #1a5d1a; border: 12px solid #3d2b1f; border-radius: 150px; position: relative; box-shadow: inset 0 0 50px #000; }
        .community { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 5px; }
        .card { width: 35px; height: 52px; background: #fff; color: #000; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; border: 1px solid #000; }
        .red { color: #e74c3c; }
        .player { position: absolute; width: 80px; text-align: center; }
        .p-box { background: rgba(0,0,0,0.85); padding: 8px; border-radius: 12px; border: 1px solid #444; }
        .active { border: 2px solid #f1c40f; box-shadow: 0 0 15px #f1c40f; }
        .chips-on-table { color: #f1c40f; font-weight: bold; font-size: 14px; margin-top: 10px; text-shadow: 1px 1px 2px #000; }
        #controls { background: #111; padding: 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        button { padding: 15px; border-radius: 10px; border: none; font-weight: bold; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <div id="setup" style="padding:100px; text-align:center;">
        <input type="text" id="user" placeholder="שם לשולחן" style="padding:12px; border-radius:8px;"><br><br>
        <button style="background:#f1c40f; color:#000" onclick="join()">הצטרף למשחק</button>
    </div>
    <div id="game-ui" style="display:none; height:100%; display:flex; flex-direction:column;">
        <div id="admin">
            <span>SB Amount:</span><input type="number" id="sb_val" value="5" style="width:50px;">
            <button onclick="socket.emit('startGame', {sb: parseInt(document.getElementById('sb_val').value)})" style="background:#f1c40f; color:#000">חלק יד חדשה</button>
        </div>
        <div id="table">
            <div class="green-felt">
                <div style="position:absolute; width:100%; text-align:center; top:20px; color:#f1c40f; font-weight:bold;">קופה: <span id="pot">0</span></div>
                <div class="community" id="comm_cards"></div>
                <div id="player_list"></div>
            </div>
        </div>
        <div id="my_hand" style="display:flex; justify-content:center; gap:10px; padding:10px;"></div>
        <div id="controls">
            <button style="background:#c0392b" onclick="socket.emit('action', {type:'fold'})">FOLD</button>
            <button style="background:#7f8c8d" onclick="socket.emit('action', {type:'check'})">CHECK / CALL</button>
            <button style="background:#2980b9" onclick="socket.emit('action', {type:'bet', raise: 50})">RAISE 50</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let state = {};
        function join() {
            const n = document.getElementById('user').value;
            if(n) { socket.emit('joinGame', n); document.getElementById('setup').style.display='none'; document.getElementById('game-ui').style.display='flex'; }
        }
        function cardHtml(c) { return `<div class="card ${c.s==='♥'||c.s==='♦'?'red':''}">${c.v}<br>${c.s}</div>`; }
        socket.on('updatePlayers', (ps) => {
            const me = ps.find(p=>p.id===socket.id);
            if(me?.isAdmin) document.getElementById('admin').style.display='flex';
            draw(ps);
        });
        socket.on('gameUpdate', (data) => {
            state = data.gameState;
            document.getElementById('pot').innerText = state.pot;
            document.getElementById('comm_cards').innerHTML = state.communityCards.map(cardHtml).join('');
            const me = data.players.find(p=>p.id===socket.id);
            if(me) document.getElementById('my_hand').innerHTML = me.cards.map(cardHtml).join('');
            draw(data.players);
        });
        function draw(ps) {
            const list = document.getElementById('player_list'); list.innerHTML = '';
            ps.forEach((p, i) => {
                const angle = (i/ps.length)*2*Math.PI;
                const x = Math.cos(angle)*38+50; const y = Math.sin(angle)*38+50;
                const cx = Math.cos(angle)*22+50; const cy = Math.sin(angle)*22+50;
                list.innerHTML += `
                    <div class="player" style="left:${x}%; top:${y}%; transform:translate(-50%,-50%)">
                        <div class="p-box ${i===state.turnIndex?'active':''}" style="opacity:${p.status==='folded'?0.5:1}">
                            <div style="font-size:12px">${p.username}</div>
                            <div style="color:#f1c40f">$${p.chips}</div>
                        </div>
                    </div>
                    <div class="chips-on-table" style="position:absolute; left:${cx}%; top:${cy}%; transform:translate(-50%,-50%); display:${p.betThisRound>0||p.lastAction?'block':'none'}">
                        ${p.lastAction === 'Check' ? 'Check' : '🪙' + p.betThisRound}
                    </div>`;
            });
        }
    </script>
</body>
</html>
