<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Poker Management</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .setup-box { background: #1a1a1a; padding: 30px; border-radius: 15px; border: 2px solid #f1c40f; text-align: center; }
        input { display: block; width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; }
        button { background: #f1c40f; color: #000; padding: 15px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="setup-box">
        <h2 style="color: #f1c40f;">ניהול שולחן פוקר</h2>
        <p>קבע את חוקי המשחק:</p>
        
        <input type="number" id="maxBuyin" placeholder="מקסימום כניסה (למשל 500)">
        <input type="number" id="smallBlind" placeholder="Small Blind (למשל 5)">
        
        <button onclick="alert('החוקים ננעלו! עכשיו אפשר לשלוח קישור לשחקנים')">פתח שולחן</button>
    </div>

</body>
</html>
