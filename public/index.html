<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Pro Sync</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #000; color: white; font-family: sans-serif; margin: 0; }
        #admin-bar { display: none; background: #222; padding: 15px; border-bottom: 2px solid #b8860b; gap: 10px; justify-content: center; }
        .login-card { background: #111; padding: 30px; border-radius: 15px; text-align: center; width: 300px; margin: 100px auto; border: 1px solid #333; }
        .info-box { background: #b8860b; color: #000; padding: 5px; border-radius: 5px; font-weight: bold; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; background: #222; color: #fff; border: 1px solid #444; }
        button { width: 100%; padding: 15px; background: #8b6508; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="admin-bar">
        <input type="number" id="max-set" placeholder="מקסימום כניסה" style="width:100px;">
        <input type="number" id="sb-set" placeholder="SB" style="width:80px;">
        <button onclick="saveSettings()" style="width:auto; padding:10px;">נעל חוקים לשחקנים</button>
    </div>

    <div id="login-screen">
        <div class="login-card">
            <h2>כניסה למשחק</h2>
            <div id="rules-view" class="info-box">מחכה לחוקי אדמין...</div>
            <input type="text" id="p-name" placeholder="שם שחקן">
            <input type="number" id="p-buyin" placeholder="סכום כניסה">
            <button onclick="join()">היכנס לשולחן</button>
            <p id="err" style="color:red; display:none;"></p>
        </div>
    </div>

    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        
        // בדיקה: האם זה קישור אדמין?
        if (urlParams.get('admin') === 'true') {
            document.getElementById('admin-bar').style.display = 'flex';
        }

        function saveSettings() {
            const max = document.getElementById('max-set').value;
            const sb = document.getElementById('sb-set').value;
            socket.emit('set_rules', { max, sb });
            alert("החוקים עודכנו! עכשיו השחקנים יראו את המגבלה.");
        }

        socket.on('rules_updated', (data) => {
            document.getElementById('rules-view').innerText = `מקסימום: ${data.max} | SB: ${data.sb}`;
            window.currentMax = data.max;
        });

        function join() {
            const buyin = document.getElementById('p-buyin').value;
            if (buyin > window.currentMax) {
                document.getElementById('err').innerText = "חריגה מהמקסימום!";
                document.getElementById('err').style.display = 'block';
                return;
            }
            // מעבר לשולחן...
        }
    </script>
</body>
</html>
