<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; margin: 0; overflow: hidden; }
        #admin { display: none; background: #222; padding: 10px; text-align: center; border-bottom: 2px solid gold; }
        .table { width: 850px; height: 400px; background: #1a5d1a; border: 15px solid #3d2b1f; border-radius: 250px; margin: 50px auto; position: relative; box-shadow: inset 0 0 100px #000; }
        .card { width: 55px; height: 80px; background: white; border-radius: 6px; color: black; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; border: 1px solid #999; margin: 5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .red { color: red; }
        .my-hand { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; background: rgba(0,0,0,0.85); padding: 20px; border-radius: 15px; border: 2px solid gold; align-items: center; }
        .controls { position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
        button { padding: 12px 25px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; }
        .btn-call { background: #27ae60; color: white; }
        .btn-fold { background: #c0392b; color: white; }
        .player-tag { position: absolute; background: rgba(0,0,0,0.8); border: 1px solid gold; padding: 5px 10px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>

<div id="admin">
    <input type="number" id="m" value="500" style="width:60px"> 
    <input type="number" id="s" value="10" style="width:60px">
    <button onclick="socket.emit('admin_init', {max:document.getElementById('m').value, sb:document.getElementById('s').value})">אתחל משחק</button>
    <button onclick="socket.emit('next_phase')" style="background:blue; color:white;">פתח קלפי שולחן</button>
</div>

<div id="login" style="position:fixed; inset:0; background:black; z-index:1000; display:flex; align-items:center; justify-content:center;">
    <div style="background:#1a1a1a; padding:40px; border:2px solid gold; border-radius:20px; text-align:center;">
        <h2 id="info">מחכה להגדרות...</h2>
        <input type="text" id="name" placeholder="שם שחקן" style="padding:10px; margin:5px;"><br>
        <input type="number" id="buyin" placeholder="סכום כניסה" style="padding:10px; margin:5px;"><br><br>
        <button onclick="join()" style="background:gold; color:black; width:100%;">היכנס לשולחן</button>
    </div>
</div>

<div class="table">
    <div style="position:absolute; top:20%; left:50%; transform:translateX(-50%); text-align:center;">
        <div style="color:gold; font-size:12px;">קופה (POT)</div>
        <div id="pot-val" style="font-size:30px; font-weight:bold;">0</div>
    </div>
    <div id="community" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);"></div>
    <div id="player-list"></div>
</div>

<div class="controls" id="gui" style="display:none;">
    <button class="btn-fold" onclick="socket.emit('action', {type:'fold'})">FOLD</button>
    <button class="btn-call" onclick="socket.emit('action', {type:'call'})">CHECK / CALL</button>
</div>

<div class="my-hand" id="my-hand" style="display:none;">
    <div style="margin-left:15px; color:gold; font-weight:bold;">הקלפים שלך:</div>
    <div id="cards-container"></div>
</div>

<script>
    const socket = io();
    if (new URLSearchParams(window.location.search).get('admin')) document.getElementById('admin').style.display='block';

    function join() {
        const n = document.getElementById('name').value;
        const b = document.getElementById('buyin').value;
        socket.emit('join', {name: n, buyin: b});
        document.getElementById('login').style.display='none';
        document.getElementById('gui').style.display='flex';
        document.getElementById('my-hand').style.display='flex';
    }

    function renderCard(c) {
        const val = c.slice(0, -1);
        const suit = c.slice(-1);
        const icons = {h:'♥', d:'♦', s:'♠', c:'♣'};
        const isRed = (suit==='h' || suit==='d') ? 'red' : '';
        return `<div class="card ${isRed}"><div>${val}</div><div>${icons[suit]}</div></div>`;
    }

    socket.on('sync', (g) => {
        document.getElementById('info').innerText = `חוקים: מקסימום ${g.maxBuyin} | SB: ${g.sb}`;
        document.getElementById('pot-val').innerText = g.pot;
        
        // קלפי שולחן
        let show = 0;
        if(g.phase === 'flop') show = 3; else if(g.phase === 'turn') show = 4; else if(g.phase === 'river') show = 5;
        document.getElementById('community').innerHTML = g.community.slice(0, show).map(renderCard).join('');

        // הצגת שחקנים מסביב
        document.getElementById('player-list').innerHTML = g.players.map((p, i) => `
            <div class="player-tag" style="left:${10+i*20}%; bottom:20px;">
                <div style="background:red; border-radius:50%; width:25px; height:25px; margin:auto; border:1px solid white; font-size:10px; display:flex; align-items:center; justify-content:center;">${p.bet}</div>
                <div>${p.name}</div><div style="color:#2ecc71;">$${p.stack}</div>
            </div>
        `).join('');

        // הקלפים האישיים שלי
        const me = g.players.find(p => p.id === socket.id);
        if(me && me.cards) {
            document.getElementById('cards-container').innerHTML = me.cards.map(renderCard).join('');
        }
    });
</script>
</body>
</html>
