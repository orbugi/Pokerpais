<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #000; color: white; font-family: sans-serif; margin: 0; }
        #admin-panel { display: none; background: #222; padding: 10px; border-bottom: 2px solid #b8860b; justify-content: center; gap: 10px; }
        .table { width: 90%; height: 60vh; background: #1a5d1a; border: 10px solid #3d2b1f; border-radius: 500px; margin: 20px auto; position: relative; box-shadow: inset 0 0 50px #000; }
        .card-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 10px; }
        .card { width: 50px; height: 75px; background: white; color: black; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
        input { padding: 10px; border-radius: 5px; }
        button { padding: 10px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="admin-panel">
    <input type="number" id="m-set" placeholder="מקסימום">
    <input type="number" id="s-set" placeholder="SB">
    <button onclick="lockRules()" style="background:#b8860b;">נעל חוקים</button>
    <button onclick="deal()" style="background:#27ae60; color:white;">חלק יד (פלופ)</button>
</div>

<div id="login" style="text-align:center; padding-top:50px;">
    <h2 id="msg">מחכה לאדמין...</h2>
    <input type="text" id="p-name" placeholder="שם שחקן"><br><br>
    <input type="number" id="p-buyin" placeholder="סכום כניסה"><br><br>
    <button onclick="enter()">היכנס למשחק</button>
</div>

<div id="game" style="display:none;">
    <div class="table">
        <div class="card-area" id="cards"></div>
    </div>
</div>

<script>
    const socket = io();
    const isAdmin = new URLSearchParams(window.location.search).get('admin') === 'true';
    if (isAdmin) document.getElementById('admin-panel').style.display = 'flex';

    function lockRules() {
        socket.emit('set_rules', { 
            max: document.getElementById('m-set').value, 
            sb: document.getElementById('s-set').value 
        });
    }

    function deal() { socket.emit('deal_cards'); }

    socket.on('rules_updated', (data) => {
        document.getElementById('msg').innerText = `חוקים: מקסימום ${data.max} | SB: ${data.sb}`;
        window.maxB = data.max;
    });

    socket.on('cards_dealt', (data) => {
        const area = document.getElementById('cards');
        area.innerHTML = data.flop.map(c => `<div class="card">${c}</div>`).join('');
    });

    function enter() {
        if (document.getElementById('p-buyin').value > window.maxB) return alert("חורג!");
        document.getElementById('login').style.display = 'none';
        document.getElementById('game').style.display = 'block';
    }
</script>
</body>
</html>
